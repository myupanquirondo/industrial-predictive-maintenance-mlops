[project]
name = "industrial-predictive-maintenance-mlops"
version = "0.1.0"
description = "Industrial predictive maintenance MLOps platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-ml>=1.35.1",
    "azure-identity>=1.26.0",
    "azureml-mlflow>=1.60.0",
    "mlflow>=3.16.1",
    "numpy",
    "pandas",
    "scikit-learn",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
