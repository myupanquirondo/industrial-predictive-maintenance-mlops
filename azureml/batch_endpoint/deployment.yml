$schema: https://azuremlschemas.azureedge.net/latest/batchDeployment.schema.json

name: blue

endpoint_name: predictive-maintenance-batch

description: Batch deployment for predictive maintenance inference.

type: model

model: azureml:predictive-maintenance-xgboost:1

code_configuration:
  code: .
  scoring_script: score.py

environment: azureml:predictive-maintenance-inference:2

compute: azureml:batch-cluster

resources:
  instance_count: 1

max_concurrency_per_instance: 1

mini_batch_size: 1

retry_settings:
  max_retries: 2
  timeout: 300

output_action: append_row